# =============================================================================
# CliPaw Desktop Build — Tauri 精简打包流程
# =============================================================================
#
# 设计目的:
#   相比 main 分支的完整 workflow（包含 legacy 打包、Tauri 打包、校验、
#   OSS 上传、updater 签名等），本分支只保留 Tauri Windows + macOS 两个
#   打包 job，打包完成后直接上传到 GitHub Release。
#
#   - 不做 release secrets 校验（移除 check-release-secrets job）
#   - 不做桌面应用功能验证（移除 verify / stop-server / screenshot 步骤）
#   - 不做 OSS 上传和索引更新（移除 upload-release job 中的 ossutil 逻辑）
#   - 不做 Tauri updater 签名（不传 TAURI_SIGNING_PRIVATE_KEY 等环境变量；
#     sync_tauri_version.mjs 检测到密钥缺失时会自动跳过 createUpdaterArtifacts）
#   - 不需要 packaging 库（generate_update_manifest.py 不会被调用）
#
# 打包范围:
#   1. build-tauri-windows — Windows NSIS 安装包 (.exe)
#   2. build-tauri-macos  — macOS .app 打包为 .zip
#
# 触发方式:
#   - release published: 自动打包并上传到对应 Release
#   - workflow_dispatch:  手动触发，通过 release_tag 指定上传目标 Release
#
# 上传方式:
#   每个 job 打包完成后直接用 softprops/action-gh-release 上传到 GitHub
#   Release，无需中间 artifact 中转。需要 permissions: contents: write。
# =============================================================================

name: CliPaw Desktop Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upload to an existing GitHub Release (tag name, e.g. v1.1.9)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Tauri — Windows
  # ═══════════════════════════════════════════════════════════════════
  build-tauri-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content src/qwenpaw/__version__.py -Raw
          if ($content -match '__version__\s*=\s*"([^"]+)"') {
            $v = $Matches[1]
          } else {
            throw "Failed to extract version from __version__.py"
          }
          "version<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $v | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/src-tauri

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      - name: Clean dist directory
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item -Recurse -Force dist
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Build Tauri Windows package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/pack-tauri/build_win_pyinstaller.ps1

      - name: Stage Tauri Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "console/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "No Tauri Windows installer found"
          }
          $target = "dist/CliPaw-Tauri-${{ steps.version.outputs.version }}-Windows-setup.exe"
          Copy-Item -Force $installer.FullName $target
          Write-Host "Staged Tauri Windows installer: $target"

      - name: Upload to GitHub Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/CliPaw-Tauri-*-Windows-setup.exe

  # ═══════════════════════════════════════════════════════════════════
  # Tauri — macOS
  # ═══════════════════════════════════════════════════════════════════
  build-tauri-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        run: echo "version=$(sed -n 's/^__version__[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src/qwenpaw/__version__.py)" >> $GITHUB_OUTPUT

      - name: Resolve release tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          PIP_NO_CACHE_DIR: "1"
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/src-tauri

      - name: Clean dist directory
        run: rm -rf dist && mkdir -p dist

      - name: Build Tauri macOS package
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/pack-tauri/build_macos_pyinstaller.sh
          bash scripts/pack-tauri/build_macos_pyinstaller.sh

      - name: Upload to GitHub Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/CliPaw-Tauri-*-macOS.zip
